<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Hole Test B</title>
<style>
  :root { --bg:#0f1a14; --fg:#e8f3ec; --sub:#9ab5a4; --acc:#3ddc84; --box:#1b3024; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  h1 { margin:0 0 4px; font-size:28px; }
  h1 span { color:var(--acc); }
  p.desc { margin:0 0 12px; color:var(--sub); font-size:14px; }
  /* A와 위치를 다르게 두어 남은 A 프레임이 구분되게 한다 */
  .wrap { padding-top:120px; }
  video { display:block; width:100%; max-width:640px; margin-left:auto; aspect-ratio:16/9; background:#000; }
  .btns { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
  .btns a, .btns button { padding:12px 18px; font-size:16px; border:0; border-radius:8px; background:var(--box); color:var(--fg); text-decoration:none; cursor:pointer; }
  .btns a.go { background:var(--acc); color:#111; font-weight:700; }
  #log { max-width:800px; height:160px; overflow:auto; margin:0; padding:8px; background:var(--box); font:12px/1.4 monospace; white-space:pre-wrap; }
</style>
</head>
<body>
<h1>Page <span>B</span> — 60% 지점부터 재생</h1>
<p class="desc">같은 영상을 중간 장면부터 재생합니다(A와 장면·위치를 다르게 함). 재생과 전체화면 전환 중에 A 영상의 프레임이 겹치는지 보세요.</p>

<div class="btns">
  <button id="play">▶ 재생</button>
  <button id="fs">⛶ 전체화면</button>
  <a class="go" href="a.html">← A로 이동</a>
  <button id="back">← 뒤로 가기(history)</button>
</div>

<div class="wrap">
  <video id="v" controls playsinline preload="auto">
    <source src="https://easyhtml5video.com/assets/video/new/Penguins_of_Madagascar.mp4" type="video/mp4">
  </video>
</div>
<pre id="log"></pre>

<script>
  // unload/beforeunload 핸들러는 bfcache 진입을 막으므로 사용하지 않는다.
  const v = document.getElementById('v');
  const logEl = document.getElementById('log');
  function log(m) {
    const t = new Date().toTimeString().slice(0, 8);
    logEl.textContent = t + '  ' + m + '\n' + logEl.textContent;
  }
  v.addEventListener('loadedmetadata', () => {
    if (v.currentTime < 1 && isFinite(v.duration)) v.currentTime = v.duration * 0.6;
  }, { once: true });
  document.getElementById('play').onclick = () => v.play().catch(e => log('play 실패: ' + e.message));
  document.getElementById('fs').onclick = () => (v.requestFullscreen || v.webkitRequestFullscreen).call(v);
  document.getElementById('back').onclick = () => history.back();
  ['play', 'pause', 'playing', 'ended', 'error'].forEach(e => v.addEventListener(e, () => log('video ' + e)));

  const nav = performance.getEntriesByType('navigation')[0];
  log('navigation type: ' + (nav ? nav.type : 'unknown'));
  window.addEventListener('pageshow', e => log('pageshow persisted=' + e.persisted + (e.persisted ? '  ← bfcache에서 복원됨' : '')));
  window.addEventListener('pagehide', e => log('pagehide persisted=' + e.persisted));
</script>
</body>
</html>
