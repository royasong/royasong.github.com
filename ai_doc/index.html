<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 문서 목록</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --border:#d6d9de; --text:#2f343b; --muted:#7a828d; --link:#315f9f; --hover:#eef4fb; --chip:#eef4fb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16191d; --card:#1f2328; --border:#363c44; --text:#d8dde3; --muted:#8b939d; --link:#8ab4f0; --hover:#262c34; --chip:#262c34; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:.85rem; margin-bottom:16px; }
  .sub a { color:var(--link); }
  input { width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:6px; background:var(--card); color:var(--text); margin-bottom:12px; font-size:.95rem; }
  ul { list-style:none; margin:0; padding:0; background:var(--card); border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  li a { display:flex; align-items:center; gap:10px; padding:10px 14px; color:var(--link); text-decoration:none; border-top:1px solid var(--border); word-break:break-all; }
  li:first-child a { border-top:none; }
  li a:hover { background:var(--hover); }
  .ext { font-size:.7rem; color:var(--muted); background:var(--chip); border:1px solid var(--border); border-radius:4px; padding:1px 6px; min-width:44px; text-align:center; flex-shrink:0; }
  .empty { padding:14px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>AI 문서 목록</h1>
  <div class="sub"><a href="../index.htm">← 메인으로</a> · <span id="count"></span></div>
  <input id="q" type="search" placeholder="파일 이름 검색">
  <ul id="list"><li class="empty">불러오는 중…</li></ul>
</main>
<script>
const FALLBACK = ["CVE-2026-13855_OSSW-7411.pptx", "CVE-2026-95334.pptx", "apple_podcasts_select_disabled_option.html", "blockfile_cache_period_size.html", "claude_crash_stack_trace_review.htm", "claude_popup_player_bug.htm", "codex_crash-stack-trace-review.htm", "disk_cache_blockfile_vs_simple.html", "picknow_app_partition_storage.html"];
const list = document.getElementById('list'), q = document.getElementById('q');
let files = [];
function render() {
  const k = q.value.trim().toLowerCase();
  const shown = files.filter(f => f.toLowerCase().includes(k));
  document.getElementById('count').textContent = shown.length + '개 파일';
  list.innerHTML = '';
  if (!shown.length) { list.innerHTML = '<li class="empty">파일이 없습니다</li>'; return; }
  for (const f of shown) {
    const li = document.createElement('li'), a = document.createElement('a');
    a.href = encodeURIComponent(f);
    a.target = '_blank'; a.rel = 'noopener';
    const ext = document.createElement('span');
    ext.className = 'ext'; ext.textContent = (f.split('.').pop() || '').toUpperCase();
    a.append(ext, document.createTextNode(f));
    li.append(a); list.append(li);
  }
}
q.addEventListener('input', render);
fetch('https://api.github.com/repos/royasong/royasong.github.com/contents/ai_doc')
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(d => d.filter(x => x.type === 'file' && x.name !== 'index.html' && !x.name.startsWith('.')).map(x => x.name))
  .catch(() => FALLBACK)
  .then(f => { files = f.sort((a, b) => a.localeCompare(b)); render(); });
</script>
</body>
</html>
