name: Update PR review counts

# 이 워크플로우는 데이터를 main이 아닌 전용 브랜치(pr-data)에 커밋한다.
# main 브랜치를 amend/force-push 하는 습관이 있어도, pr-data 브랜치는
# 그 영향을 받지 않으므로 카운트 데이터가 안전하게 유지된다.
# pr-data 브랜치가 아직 없다면 아래 명령으로 먼저 만들어야 한다:
#   git checkout --orphan pr-data
#   git rm -rf .
#   mkdir -p webdata
#   echo '{"updatedAt": null, "counts": {}}' > webdata/pr_review_counts.json
#   git add webdata/pr_review_counts.json
#   git commit -m "chore: init pr-data branch"
#   git push origin pr-data
#   git checkout main

on:
  schedule:
    # 매시 07/27/47분에 실행 (20분 간격). GitHub 문서상 0/15/30/45분처럼 정각에
    # 걸린 스케줄은 부하가 몰려 지연되기 쉬우므로 일부러 7분 오프셋을 둠.
    - cron: '7,27,47 * * * *'
  workflow_dispatch: {}      # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

jobs:
  update-counts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pr-data branch
        uses: actions/checkout@v4
        with:
          ref: pr-data

      - name: Fetch review-requested PR counts
        env:
          GH_TOKEN: ${{ secrets.PR_REVIEW_PAT }}
        run: |
          set -euo pipefail

          repos=(
            obigo-af-agb-92
            obigo-af-agb-143
            obigo-ccos-qml-application
            webappmanager-plugin-pal
            obigo-local-webserver-apps
            obigo-linux-af
            obigo-common-build-suite
            mf1_dev_tools
          )

          counts='{}'
          for repo in "${repos[@]}"; do
            count=$(gh api --method GET /search/issues -f q="is:pr is:open review-requested:@me repo:OBIGOGIT/${repo}" --jq '.total_count')
            counts=$(echo "$counts" | jq --arg repo "$repo" --argjson count "$count" '.[$repo] = $count')
          done

          mkdir -p webdata
          jq -n \
            --argjson counts "$counts" \
            --arg updatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{updatedAt: $updatedAt, counts: $counts}' \
            > webdata/pr_review_counts.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webdata/pr_review_counts.json
          if git diff --cached --quiet; then
            echo "변경 없음, 커밋 스킵"
          else
            git commit -m "chore: PR 리뷰 카운트 갱신"
            git push origin pr-data
          fi
